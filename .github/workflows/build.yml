name: Build CloudStream Extensions
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudstream-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build CloudStream plugins and manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean make makePluginsJson
      - name: Validate build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          find . -path '*/build/*.cs3' -type f -exec cp {} publish/ \\;
          test "$(find publish -maxdepth 1 -name '*.cs3' | wc -l)" -eq 3
          test -s build/plugins.json
          cp build/plugins.json publish/plugins.json
          cp repo.json publish/repo.json
          python3 - <<'PYCODE'
          import json, pathlib
          data=json.loads(pathlib.Path('publish/plugins.json').read_text())
          assert isinstance(data,dict) and data, 'plugins.json missing or empty'
          repo=json.loads(pathlib.Path('publish/repo.json').read_text())
          assert repo.get('manifestVersion') == 1 and repo.get('pluginLists'), 'repo.json invalid'
          print('JSON validation passed')
          PYCODE
      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build CloudStream extensions from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
