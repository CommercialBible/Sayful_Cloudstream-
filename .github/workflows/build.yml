name: Build CloudStream Extensions
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudstream-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_DIR" || { echo "Android SDK not found at $SDK_DIR"; exit 1; }
          echo "Using Android SDK at $SDK_DIR"
          ls -1 "$SDK_DIR/platforms" || true
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Build CloudStream plugins and manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean make makePluginsJson
      - name: Validate build outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publish
          find . -type f -path '*/build/*.cs3' -print0 | while IFS= read -r -d '' file; do
            cp "$file" publish/
          done
          count="$(find publish -maxdepth 1 -type f -name '*.cs3' | wc -l)"
          test "$count" -eq 48 || { echo "Expected 48 individual provider plugins, found $count"; exit 1; }
          test -s build/plugins.json
          cp build/plugins.json publish/plugins.json
          cp repo.json publish/repo.json
          python3 - <<'PYCODE'
          import json, pathlib
          data=json.loads(pathlib.Path('publish/plugins.json').read_text())
          assert isinstance(data, (dict, list)) and len(data) > 0, 'plugins.json missing or empty'
          repo=json.loads(pathlib.Path('publish/repo.json').read_text())
          assert isinstance(repo, dict), 'repo.json must contain a JSON object'
          assert repo.get('manifestVersion') == 1 and repo.get('pluginLists'), 'repo.json invalid'
          print('JSON validation passed')
          PYCODE
      - name: Publish to builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd publish
          git init
          git checkout -b builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Build CloudStream extensions from ${GITHUB_SHA}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin builds
